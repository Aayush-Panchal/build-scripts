name: Currency Build Pipeline (Enhanced with COS Integration)

on:
  push:
    branches:
      - master
      - replica-master

jobs:

  build_info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate scanner environment
        run: |
          echo "PACKAGE_NAME=${{ github.event.repository.name }}" >> scanner-env.sh
          echo "VERSION=${{ github.ref_name }}" >> scanner-env.sh
          echo "GHA_RUN_ID=${{ github.run_id }}" >> scanner-env.sh

      - name: Upload scanner-env to COS
        run: |
          chmod +x gha-script/upload-scripts/upload_file.sh
          ./gha-script/upload-scripts/upload_file.sh scanner-env.sh


  build:
    needs: build_info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Download scanner-env from COS
        run: |
          chmod +x gha-script/download-scripts/download_file.sh
          ./gha-script/download-scripts/download_file.sh scanner-env.sh

      - name: Build Package
        run: |
          source scanner-env.sh
          echo "Building $PACKAGE_NAME version $VERSION"
          python3 setup.py sdist bdist_wheel


  wheel_build:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Download scanner-env from COS
        run: |
          chmod +x gha-script/download-scripts/download_file.sh
          ./gha-script/download-scripts/download_file.sh scanner-env.sh
          source scanner-env.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build Wheel
        run: |
          python3 -m build --wheel
          mkdir -p package-cache/wheels
          mv dist/*.whl package-cache/wheels/

      - name: Upload built wheels to COS
        run: |
          chmod +x gha-script/upload-scripts/upload_wheels.sh
          for wheel in package-cache/wheels/*.whl; do
            ./gha-script/upload-scripts/upload_wheels.sh "$wheel"
          done


  collect_wheels:
    needs: wheel_build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built wheels from COS
        run: |
          chmod +x gha-script/download-scripts/download_wheels.sh
          ./gha-script/download-scripts/download_wheels.sh

      - name: Create wheel-collection tarball
        run: |
          tar -czf wheel-collection.tar.gz wheels/
          chmod +x gha-script/upload-scripts/upload_file.sh
          ./gha-script/upload-scripts/upload_file.sh wheel-collection.tar.gz


  wheel_scanner:
    needs: collect_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel-collection from COS
        run: |
          chmod +x gha-script/download-scripts/download_file.sh
          ./gha-script/download-scripts/download_file.sh wheel-collection.tar.gz
          tar -xzf wheel-collection.tar.gz

      - name: Run ScanCode Toolkit on wheels
        run: |
          pip install scancode-toolkit
          scancode -clp --json-pp wheel_scan_results.json wheels/
          chmod +x gha-script/upload-scripts/upload_file.sh
          ./gha-script/upload-scripts/upload_file.sh wheel_scan_results.json


  source_scanner:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download scanner-env from COS
        run: |
          chmod +x gha-script/download-scripts/download_file.sh
          ./gha-script/download-scripts/download_file.sh scanner-env.sh
          source scanner-env.sh

      - name: Run Source Scan
        run: |
          pip install scancode-toolkit
          scancode -clp --json-pp source_scan_results.json .
          chmod +x gha-script/upload-scripts/upload_file.sh
          ./gha-script/upload-scripts/upload_file.sh source_scan_results.json


  build_docker:
    needs: wheel_scanner
    runs-on: ubuntu-latest
    steps:
      - name: Download scanner-env from COS
        run: |
          chmod +x gha-script/download-scripts/download_file.sh
          ./gha-script/download-scripts/download_file.sh scanner-env.sh
          source scanner-env.sh

      - name: Build Docker image
        run: |
          docker build -t $PACKAGE_NAME:$VERSION .
          export IMAGE_NAME=$PACKAGE_NAME:$VERSION
          chmod +x gha-script/upload-scripts/upload_docker_image.sh
          ./gha-script/upload-scripts/upload_docker_image.sh


  image_scanner:
    needs: build_docker
    runs-on: ubuntu-latest
    steps:
      - name: Download scanner-env from COS
        run: |
          chmod +x gha-script/download-scripts/download_file.sh
          ./gha-script/download-scripts/download_file.sh scanner-env.sh
          source scanner-env.sh

      - name: Run Trivy & Syft Scans
        run: |
          docker pull $PACKAGE_NAME:$VERSION
          trivy image --format json -o trivy_scan.json $PACKAGE_NAME:$VERSION
          syft $PACKAGE_NAME:$VERSION -o json > syft_scan.json
          chmod +x gha-script/upload-scripts/upload_file.sh
          ./gha-script/upload-scripts/upload_file.sh trivy_scan.json
          ./gha-script/upload-scripts/upload_file.sh syft_scan.json


  final_summary:
    needs: [wheel_scanner, source_scanner, image_scanner]
    runs-on: ubuntu-latest
    steps:
      - name: Download all scan results from COS
        run: |
          chmod +x gha-script/download-scripts/download_file.sh
          ./gha-script/download-scripts/download_file.sh wheel_scan_results.json
          ./gha-script/download-scripts/download_file.sh source_scan_results.json
          ./gha-script/download-scripts/download_file.sh trivy_scan.json
          ./gha-script/download-scripts/download_file.sh syft_scan.json

      - name: Generate consolidated report
        run: |
          python3 process_bom/run_currency_processor.py \
            --wheel wheel_scan_results.json \
            --source source_scan_results.json \
            --image trivy_scan.json syft_scan.json

      - name: Upload final summary
        run: |
          chmod +x gha-script/upload-scripts/upload_file.sh
          ./gha-script/upload-scripts/upload_file.sh final_summary.json
